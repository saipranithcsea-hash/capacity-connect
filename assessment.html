<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Assessment - Skill Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-box">

        <h1>Skill Assessment</h1>

        <p>
            Choose your current skill level if you already know it.
        </p>

        <label>HTML</label>

        <select id="htmlLevel">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
        </select>

        <br><br>

        <label>CSS</label>

        <select id="cssLevel">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
        </select>

        <br><br>

        <label>JavaScript</label>

        <select id="jsLevel">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
        </select>

        <br><br>

        <button onclick="saveAssessment()">
            Submit Assessment
        </button>

        <p id="message"></p>

        <hr>

        <h2>Not sure about your level?</h2>

        <p>
            Take a short objective skill test and let Skill Connect
            analyze your current level automatically.
        </p>

        <button onclick="window.location.href='skill-test.html'">
            Know Your Level by Test
        </button>

    </div>


    <script>

        window.onload = function() {

            document.getElementById("htmlLevel").value =
                localStorage.getItem("htmlLevel") || "Beginner";

            document.getElementById("cssLevel").value =
                localStorage.getItem("cssLevel") || "Beginner";

            document.getElementById("jsLevel").value =
                localStorage.getItem("jsLevel") || "Beginner";
        };


        function saveAssessment() {

            let htmlLevel =
                document.getElementById("htmlLevel").value;

            let cssLevel =
                document.getElementById("cssLevel").value;

            let jsLevel =
                document.getElementById("jsLevel").value;


            localStorage.setItem("htmlLevel", htmlLevel);

            localStorage.setItem("cssLevel", cssLevel);

            localStorage.setItem("jsLevel", jsLevel);


            localStorage.setItem("assessmentMethod", "Manual");


            document.getElementById("message").innerText =
                "Assessment saved successfully!";


            setTimeout(function() {

                window.location.href =
                    "recommendation.html";

            }, 1000);

        }

    </script>

</body>

</html>
