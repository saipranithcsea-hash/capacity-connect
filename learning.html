<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning - Capacity Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-box recommendation-box">

        <h1>Your Learning Path</h1>

        <p id="learningMessage">
            Your learning content is ready.
        </p>

        <div class="card recommendation-card">

            <h3 id="courseTitle">JavaScript Basics</h3>

            <p id="courseText">
                Learn JavaScript fundamentals step by step.
            </p>

            <p><strong>Choose Language:</strong></p>

            <button onclick="changeLanguage('English')">
                English
            </button>

            <button onclick="changeLanguage('Telugu')">
                Telugu
            </button>

            <button onclick="changeLanguage('Hindi')">
                Hindi
            </button>

            <br><br>

            <h3 id="lessonTitle">
                JavaScript Basics - English
            </h3>

            <p id="lessonText">
                Learn the fundamentals of JavaScript.
            </p>

            <a href="quiz.html" class="start-button">
                Start Quiz
            </a>

        </div>

        <p>
            <a href="recommendation.html">&larr; Back to Recommendations</a>
        </p>

    </div>

    <script>
        const lessons = {
            "HTML": {
                title: "HTML Fundamentals",
                description: "Learn the structure and building blocks of web pages.",
                english: "Learn HTML tags, headings, paragraphs, links, images, and forms.",
                telugu: "HTML tags, headings, paragraphs, links, images mariyu forms nerchukondi.",
                hindi: "HTML tags, headings, paragraphs, links, images aur forms seekhein."
            },

            "CSS": {
                title: "CSS Fundamentals",
                description: "Learn styling, layouts, colours, and responsive design.",
                english: "Learn CSS colours, fonts, spacing, layouts, and responsive design.",
                telugu: "CSS colours, fonts, spacing, layouts mariyu responsive design nerchukondi.",
                hindi: "CSS colours, fonts, spacing, layouts aur responsive design seekhein."
            },

            "JavaScript": {
                title: "JavaScript Basics",
                description: "Learn JavaScript fundamentals step by step.",
                english: "Learn JavaScript variables, functions, conditions, and events.",
                telugu: "JavaScript variables, functions, conditions mariyu events nerchukondi.",
                hindi: "JavaScript variables, functions, conditions aur events seekhein."
            },

            "Web Development": {
                title: "Advanced Web Development",
                description: "Your core skills are strong. Continue with advanced web development.",
                english: "Build a complete project using HTML, CSS, and JavaScript.",
                telugu: "HTML, CSS mariyu JavaScript use chesi complete project build cheyandi.",
                hindi: "HTML, CSS aur JavaScript ka use karke complete project banaiye."
            }
        };

        let selectedCourse =
            localStorage.getItem("selectedLearningSkill") ||
            localStorage.getItem("recommendedSkill") ||
            "JavaScript";

        let selectedLanguage =
            localStorage.getItem("selectedLanguage") || "English";

        if (!lessons[selectedCourse]) {
            selectedCourse = "JavaScript";
        }

        function showLesson() {
            const lesson = lessons[selectedCourse];

            document.getElementById("learningMessage").innerText =
                "You chose " + lesson.title +
                ". You can return to Recommendations anytime to choose another course.";

            document.getElementById("courseTitle").innerText =
                lesson.title;

            document.getElementById("courseText").innerText =
                lesson.description;

            document.getElementById("lessonTitle").innerText =
                lesson.title + " - " + selectedLanguage;

            if (selectedLanguage === "Telugu") {
                document.getElementById("lessonText").innerText =
                    lesson.telugu;
            } else if (selectedLanguage === "Hindi") {
                document.getElementById("lessonText").innerText =
                    lesson.hindi;
            } else {
                document.getElementById("lessonText").innerText =
                    lesson.english;
            }
        }

        function changeLanguage(language) {
            selectedLanguage = language;

            localStorage.setItem("selectedLanguage", selectedLanguage);

            showLesson();
        }

        showLesson();
    </script>

</body>
</html>
