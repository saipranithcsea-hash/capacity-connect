<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning - Capacity Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-box">

        <h1>Learning Hub</h1>

        <div class="card">

            <h3 id="courseTitle">JavaScript Basics</h3>

<p id="courseText">
    Learn JavaScript fundamentals step by step.
</p>
            <p><strong>Choose Language:</strong></p>

            <button onclick="changeLanguage('English')">
                English
            </button>

            <button onclick="changeLanguage('Telugu')">
                Telugu
            </button>

            <button onclick="changeLanguage('Hindi')">
                Hindi
            </button>

            <br><br>

            <h3 id="lessonTitle">
                JavaScript Basics - English
            </h3>

            <p id="lessonText">
                Learn the fundamentals of JavaScript.
            </p>

            <a href="quiz.html" class="start-button">
                Start Quiz
            </a>

        </div>


        <div class="card">

            <h3>Web Development</h3>

            <p>
                Learn HTML, CSS and basic web development.
            </p>

        </div>


        <p>
            <a href="recommendation.html">
                ← Back to Recommendations
            </a>
        </p>

    </div>


    <script>
        let htmlLevel =
    localStorage.getItem("htmlLevel") || "Beginner";

let cssLevel =
    localStorage.getItem("cssLevel") || "Beginner";

let jsLevel =
    localStorage.getItem("jsLevel") || "Beginner";

let courseTitle =
    document.getElementById("courseTitle");

let courseText =
    document.getElementById("courseText");

if (jsLevel === "Beginner") {

    courseTitle.innerText =
        "JavaScript Basics";

    courseText.innerText =
        "Learn JavaScript fundamentals step by step.";

}

else if (htmlLevel === "Beginner") {

    courseTitle.innerText =
        "HTML Fundamentals";

    courseText.innerText =
        "Learn HTML fundamentals step by step.";

}

else if (cssLevel === "Beginner") {

    courseTitle.innerText =
        "CSS Fundamentals";

    courseText.innerText =
        "Learn CSS fundamentals step by step.";

}

else {

    courseTitle.innerText =
        "Advanced Web Development";

    courseText.innerText =
        "Continue developing your web development skills.";

}

        function changeLanguage(language) {
        localStorage.setItem("selectedLanguage", language);

            let title =
                document.getElementById("lessonTitle");

            let text =
                document.getElementById("lessonText");


            if (language === "English") {

                title.innerText =
                    "JavaScript Basics - English";

                text.innerText =
                    "Learn the fundamentals of JavaScript.";

            }


            else if (language === "Telugu") {

                title.innerText =
                    "JavaScript Basics - Telugu";

                text.innerText =
                    "JavaScript yokka prathamikalanu nerchukondi.";

            }


            else if (language === "Hindi") {

                title.innerText =
                    "JavaScript Basics - Hindi";

                text.innerText =
                    "JavaScript ki mool baatein seekhein.";

            }

        }

    </script>

</body>

</html>
