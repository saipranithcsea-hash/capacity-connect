<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Skill Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-box">

        <h1>Skill Quiz</h1>

        <p id="quizDescription">
            Test your knowledge after completing the lesson.
        </p>


        <div class="card">

            <h3 id="question1Title">Question 1</h3>

            <p id="question1Text">
                Which language is mainly used to add interactivity to a web page?
            </p>

            <label>
                <input type="radio" name="q1" value="HTML">
                HTML
            </label>
            <br>

            <label>
                <input type="radio" name="q1" value="CSS">
                CSS
            </label>
            <br>

            <label>
                <input type="radio" name="q1" value="JavaScript">
                JavaScript
            </label>
            <br>

            <label>
                <input type="radio" name="q1" value="SQL">
                SQL
            </label>

        </div>


        <div class="card">

            <h3 id="question2Title">Question 2</h3>

            <p id="question2Text">
                Which language is used to style a web page?
            </p>

            <label>
                <input type="radio" name="q2" value="HTML">
                HTML
            </label>
            <br>

            <label>
                <input type="radio" name="q2" value="CSS">
                CSS
            </label>
            <br>

            <label>
                <input type="radio" name="q2" value="JavaScript">
                JavaScript
            </label>
            <br>

            <label>
                <input type="radio" name="q2" value="Python">
                Python
            </label>

        </div>


        <button onclick="calculateScore()">
            <span id="submitText">Submit Quiz</span>
        </button>

        <h2 id="result"></h2>


        <br>

        <a href="dashboard.html" class="start-button">
            <span id="dashboardText">View Dashboard</span>
        </a>


        <p>
            <a href="learning.html" id="backLearning">
                ← Back to Learning
            </a>
        </p>

    </div>


    <script>

        let selectedLanguage =
            localStorage.getItem("selectedLanguage") || "English";


        function calculateScore() {

            let score = 0;

            let answer1 = document.querySelector(
                'input[name="q1"]:checked'
            );

            let answer2 = document.querySelector(
                'input[name="q2"]:checked'
            );


            if (answer1 && answer1.value === "JavaScript") {
                score += 1;
            }


            if (answer2 && answer2.value === "CSS") {
                score += 1;
            }


            let percentage =
                (score / 2) * 100;


            document.getElementById("result").innerText =
                "Your Score: " + percentage + "%";


            localStorage.setItem(
                "quizScore",
                percentage
            );

        }


        function changeQuizLanguage(language) {

            selectedLanguage = language;

            localStorage.setItem(
                "selectedLanguage",
                language
            );


            if (language === "English") {

                document.getElementById("quizDescription").innerText =
                    "Test your knowledge after completing the lesson.";

                document.getElementById("question1Text").innerText =
                    "Which language is mainly used to add interactivity to a web page?";

                document.getElementById("question2Text").innerText =
                    "Which language is used to style a web page?";

                document.getElementById("submitText").innerText =
                    "Submit Quiz";

                document.getElementById("dashboardText").innerText =
                    "View Dashboard";

            }


            else if (language === "Telugu") {

                document.getElementById("quizDescription").innerText =
                    "Lesson taruvatha mee knowledge ni test chesukondi.";

                document.getElementById("question1Text").innerText =
                    "Web page ki interactivity ivvadaniki ye language ni upayogistaru?";

                document.getElementById("question2Text").innerText =
                    "Web page ni style cheyadaniki ye language ni upayogistaru?";

                document.getElementById("submitText").innerText =
                    "Quiz Submit Cheyyandi";

                document.getElementById("dashboardText").innerText =
                    "Dashboard Chudandi";

            }


            else if (language === "Hindi") {

                document.getElementById("quizDescription").innerText =
                    "Lesson complete karne ke baad apni knowledge test karein.";

                document.getElementById("question1Text").innerText =
                    "Web page mein interactivity add karne ke liye kaunsi language use hoti hai?";

                document.getElementById("question2Text").innerText =
                    "Web page ko style karne ke liye kaunsi language use hoti hai?";

                document.getElementById("submitText").innerText =
                    "Quiz Submit Karein";

                document.getElementById("dashboardText").innerText =
                    "Dashboard Dekhein";

            }

        }


        changeQuizLanguage(selectedLanguage);

    </script>

</body>

</html>
