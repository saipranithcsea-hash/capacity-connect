<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Test - Skill Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-box">

        <h1>Skill Connect</h1>

        <h2>Skill Level Test</h2>

        <p>
            Answer all 15 objective questions.
            Your result will be analyzed automatically.
        </p>

        <p id="progress">
            15 Total | 0 Answered | 15 Remaining
        </p>

        <hr>

        <div id="questionArea">

            <h3 id="questionNumber">
                Question 1 of 15
            </h3>

            <p id="questionText"></p>

            <div id="options"></div>

            <br>

            <button id="nextButton" onclick="nextQuestion()">
                Next
            </button>

            <p id="errorMessage"></p>

        </div>


        <div id="resultArea" style="display: none;">

            <h2>Skill Test Result</h2>

            <p>
                Your current skill levels have been detected
                based on your test performance.
            </p>

            <hr>

            <h3>HTML</h3>
            <p id="htmlResult"></p>

            <h3>CSS</h3>
            <p id="cssResult"></p>

            <h3>JavaScript</h3>
            <p id="jsResult"></p>

            <hr>

            <p id="finalMessage"></p>

            <br>

            <button onclick="goToRecommendation()">
                Continue to Recommendations
            </button>

        </div>

    </div>


    <script>

        const questions = [

            /* HTML - 5 Questions */

            {
                subject: "HTML",
                question: "Which HTML tag is used to create a hyperlink?",
                options: [
                    "a",
                    "link",
                    "href",
                    "url"
                ],
                answer: "a"
            },

            {
                subject: "HTML",
                question: "Which tag is used to create the largest heading?",
                options: [
                    "h6",
                    "heading",
                    "h1",
                    "head"
                ],
                answer: "h1"
            },

            {
                subject: "HTML",
                question: "Which HTML element is used to create an unordered list?",
                options: [
                    "ol",
                    "ul",
                    "list",
                    "li"
                ],
                answer: "ul"
            },

            {
                subject: "HTML",
                question: "Which attribute provides alternative text for an image?",
                options: [
                    "src",
                    "title",
                    "alt",
                    "text"
                ],
                answer: "alt"
            },

            {
                subject: "HTML",
                question: "Which HTML element is used to create a form?",
                options: [
                    "input",
                    "form",
                    "fieldset",
                    "label"
                ],
                answer: "form"
            },


            /* CSS - 5 Questions */

            {
                subject: "CSS",
                question: "Which CSS property is used to change text color?",
                options: [
                    "font-color",
                    "text-color",
                    "color",
                    "foreground"
                ],
                answer: "color"
            },

            {
                subject: "CSS",
                question: "Which CSS property is used to change the background color?",
                options: [
                    "background-color",
                    "bgcolor",
                    "background",
                    "color-background"
                ],
                answer: "background-color"
            },

            {
                subject: "CSS",
                question: "Which property is used to make text bold?",
                options: [
                    "font-style",
                    "font-weight",
                    "text-bold",
                    "bold"
                ],
                answer: "font-weight"
            },

            {
                subject: "CSS",
                question: "Which CSS layout system is commonly used to arrange items in a row or column?",
                options: [
                    "Flexbox",
                    "FloatBox",
                    "PositionBox",
                    "TextBox"
                ],
                answer: "Flexbox"
            },

            {
                subject: "CSS",
                question: "Which CSS property controls the space inside an element's border?",
                options: [
                    "margin",
                    "padding",
                    "spacing",
                    "border-space"
                ],
                answer: "padding"
            },


            /* JavaScript - 5 Questions */

            {
                subject: "JavaScript",
                question: "Which keyword can be used to declare a variable in JavaScript?",
                options: [
                    "let",
                    "define",
                    "variable",
                    "declare"
                ],
                answer: "let"
            },

            {
                subject: "JavaScript",
                question: "Which symbol is commonly used for strict equality comparison?",
                options: [
                    "=",
                    "==",
                    "===",
                    "!="
                ],
                answer: "==="
            },

            {
                subject: "JavaScript",
                question: "Which method is used to display a message in the browser console?",
                options: [
                    "console.log()",
                    "print()",
                    "display()",
                    "message()"
                ],
                answer: "console.log()"
            },

            {
                subject: "JavaScript",
                question: "Which keyword is used to define a function?",
                options: [
                    "function",
                    "method",
                    "define",
                    "func"
                ],
                answer: "function"
            },

            {
                subject: "JavaScript",
                question: "Which data type represents true or false?",
                options: [
                    "String",
                    "Number",
                    "Boolean",
                    "Object"
                ],
                answer: "Boolean"
            }

        ];


        let currentQuestion = 0;

        let answers = new Array(questions.length).fill(null);


        function loadQuestion() {

            let question = questions[currentQuestion];

            document.getElementById("questionNumber").innerText =
                "Question " + (currentQuestion + 1) +
                " of " + questions.length;

            document.getElementById("questionText").innerText =
                question.question;


            let optionsArea =
                document.getElementById("options");

            optionsArea.innerHTML = "";


            question.options.forEach(function(option) {

                let label = document.createElement("label");

                label.style.display = "block";
                label.style.margin = "10px 0";


                let radio = document.createElement("input");

                radio.type = "radio";
                radio.name = "answer";
                radio.value = option;


                if (answers[currentQuestion] === option) {
                    radio.checked = true;
                }


                radio.addEventListener("change", function() {

                    answers[currentQuestion] = option;

                    updateProgress();

                    document.getElementById("errorMessage").innerText = "";

                });


                label.appendChild(radio);

                label.appendChild(
                    document.createTextNode(" " + option)
                );


                optionsArea.appendChild(label);

            });


            if (currentQuestion === questions.length - 1) {

                document.getElementById("nextButton").innerText =
                    "Finish Test";

            } else {

                document.getElementById("nextButton").innerText =
                    "Next";

            }


            updateProgress();

        }


        function updateProgress() {

            let answered =
                answers.filter(function(answer) {
                    return answer !== null;
                }).length;


            let remaining =
                questions.length - answered;


            document.getElementById("progress").innerText =
                questions.length +
                " Total | " +
                answered +
                " Answered | " +
                remaining +
                " Remaining";

        }


        function nextQuestion() {

            let errorMessage =
                document.getElementById("errorMessage");


            if (answers[currentQuestion] === null) {

                errorMessage.innerText =
                    "Please select an answer before continuing.";

                return;
            }


            errorMessage.innerText = "";


            if (currentQuestion < questions.length - 1) {

                currentQuestion++;

                loadQuestion();

            } else {

                finishTest();

            }

        }


        function finishTest() {

            let unanswered =
                answers.filter(function(answer) {
                    return answer === null;
                }).length;


            if (unanswered > 0) {

                document.getElementById("errorMessage").innerText =
                    "Please answer all the questions to proceed.";

                return;

            }


            let htmlScore = 0;
            let cssScore = 0;
            let jsScore = 0;


            for (let i = 0; i < questions.length; i++) {

                if (answers[i] === questions[i].answer) {

                    if (questions[i].subject === "HTML") {
                        htmlScore++;
                    }

                    if (questions[i].subject === "CSS") {
                        cssScore++;
                    }

                    if (questions[i].subject === "JavaScript") {
                        jsScore++;
                    }

                }

            }


            let htmlLevel = calculateLevel(htmlScore);
            let cssLevel = calculateLevel(cssScore);
            let jsLevel = calculateLevel(jsScore);


            localStorage.setItem(
                "htmlLevel",
                htmlLevel
            );

            localStorage.setItem(
                "cssLevel",
                cssLevel
            );

            localStorage.setItem(
                "jsLevel",
                jsLevel
            );


            localStorage.setItem(
                "htmlTestScore",
                htmlScore
            );

            localStorage.setItem(
                "cssTestScore",
                cssScore
            );

            localStorage.setItem(
                "jsTestScore",
                jsScore
            );


            localStorage.setItem(
                "assessmentMethod",
                "Skill Test"
            );


            document.getElementById("questionArea").style.display =
                "none";

            document.getElementById("resultArea").style.display =
                "block";


            document.getElementById("htmlResult").innerText =
                htmlScore + " / 5 correct → " + htmlLevel;

            document.getElementById("cssResult").innerText =
                cssScore + " / 5 correct → " + cssLevel;

            document.getElementById("jsResult").innerText =
                jsScore + " / 5 correct → " + jsLevel;


            document.getElementById("finalMessage").innerText =
                "Your skill levels have been analyzed successfully.";

        }


        function calculateLevel(score) {

            if (score <= 1) {

                return "Beginner";

            } else if (score <= 3) {

                return "Intermediate";

            } else {

                return "Advanced";

            }

        }


        function goToRecommendation() {

            window.location.href =
                "recommendation.html";

        }


        loadQuestion();

    </script>

</body>

</html>
