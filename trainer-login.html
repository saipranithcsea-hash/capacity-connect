<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Login - Skill Connect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-box">

        <h1>Skill Connect</h1>

        <h2>Trainer Login</h2>

        <p>Authorized trainer account</p>

        <form onsubmit="trainerLogin(event)">

            <label for="trainerEmail">Trainer Email</label>
            <input
                type="email"
                id="trainerEmail"
                placeholder="Enter trainer email"
                required
            >

            <label for="trainerPassword">Password</label>
            <input
                type="password"
                id="trainerPassword"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p>
            <a href="login.html">← Back to Role Selection</a>
        </p>

    </div>


    <script>

        function trainerLogin(event) {

            event.preventDefault();

            window.location.href = "trainer-dashboard.html";

        }

    </script>

</body>

</html>
