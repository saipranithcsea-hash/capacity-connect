<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainer Login - Capacity Connect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-box">

        <h1>Capacity Connect</h1>

        <h2>Trainer Login</h2>

        <form id="trainerLoginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Trainer Email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Trainer Login
            </button>

            <p id="message"></p>

        </form>

        <p>
            <a href="index.html">
                ← Back to Home
            </a>
        </p>

    </div>

    <script>

        document
            .getElementById("trainerLoginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                document.getElementById("message").innerText =
                    "Trainer login will be connected to Firebase.";

            });

    </script>

</body>

</html>
