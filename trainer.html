<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer - Skill Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-box">

        <h1>Find a Trainer</h1>

        <p id="trainerMessage">
            Finding a suitable trainer for you...
        </p>


        <div class="card">

            <h3 id="trainerName">
                Web Development Trainer
            </h3>

            <p>
                <strong>Expertise:</strong>
                <span id="expertise">Web Development, JavaScript</span>
            </p>

            <p>
                <strong>Experience:</strong>
                5 Years
            </p>

            <p>
                <strong>Languages:</strong>
                English, Telugu
            </p>

            <p>
                <strong>Recommended For:</strong>
                <span id="recommendedSkill">JavaScript</span>
            </p>

            <button onclick="requestSession()">
                Request Session
            </button>

            <p id="message"></p>

        </div>


        <p>
            <a href="recommendation.html">
                ← Back to Recommendations
            </a>
        </p>

    </div>


    <script type="module">

    import { db } from "./firebase.js";

    import {
        collection,
        addDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    let jsLevel =
        localStorage.getItem("jsLevel") || "Beginner";


    if (jsLevel === "Beginner") {

        document.getElementById("trainerMessage").innerText =
            "Recommended trainer based on your JavaScript skill gap.";

    } else {

        document.getElementById("trainerMessage").innerText =
            "Here is a suitable Web Development trainer.";

    }


    async function requestSession() {

        const message =
            document.getElementById("message");

        const button =
            document.querySelector("button");

        try {

            button.disabled = true;
            button.innerText = "Sending...";


            await addDoc(
                collection(db, "sessionRequests"),
                {
                    trainer: "Web Development Trainer",
                    skill: "JavaScript",
                    status: "pending",
                    createdAt: serverTimestamp()
                }
            );


            message.innerText =
                "Session request sent successfully!";

            button.innerText =
                "Request Sent";


        } catch (error) {

            console.error(
                "Session request failed:",
                error
            );

            message.innerText =
                "Failed to send session request. Please try again.";

            button.disabled = false;
            button.innerText =
                "Request Session";

        }

    }


    document
        .querySelector("button")
        .addEventListener("click", requestSession);

</script>

</body>

</html>
